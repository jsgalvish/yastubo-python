version: '3.9'

x-common-env: &common-env
  DB_HOST: host.docker.internal
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-gfa}
  DB_USER: ${DB_USER:-gfa}
  DB_PASSWORD: ${DB_PASSWORD:-gfa}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  SESSION_LIFETIME_MINUTES: "480"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@yastubo.com}

x-service-base: &service-base
  build:
    context: .
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    <<: *common-env

services:

  # ── Microservices ───────────────────────────────────────────────────

  auth:
    <<: *service-base
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"

  products:
    <<: *service-base
    build:
      context: .
      dockerfile: services/products/Dockerfile
    ports:
      - "8002:8002"

  documents:
    <<: *service-base
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    ports:
      - "8003:8003"

  capitados:
    <<: *service-base
    build:
      context: .
      dockerfile: services/capitados/Dockerfile
    ports:
      - "8004:8004"

  audit:
    <<: *service-base
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    ports:
      - "8005:8005"

  billing:
    <<: *service-base
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    environment:
      <<: *common-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-price_1TGevjIpOl9JJO5pfRkAK1dJ}
    ports:
      - "8006:8006"

  # ── API Gateway ─────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - products
      - documents
      - capitados
      - audit
      - billing

  # ── Monitoring ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: yastubo2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  prometheus_data:
  grafana_data:
